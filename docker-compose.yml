services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION}
    ports:
      - "50051:50051"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50051 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:  # <-- Добавьте это
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  test_runner:
    image: ${DOCKER_USERNAME}/cwbot_base:${COMMON_IMAGES_VERSION}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - MESSAGES_FILE_PATH=/cwbot/bins/Tests/FunctionalTests/CursedWordsTest/messages.txt
    depends_on:
      grpc_server:
        condition: service_healthy
    entrypoint: []
    command: 
      - /bin/bash
      - -c
      - " cd /cwbot && ./build-local.sh && /bins/Tests/FunctionalTests/CursedWordsTest/cursedWordsTest"
    volumes:
      - .:/cwbot  # Монтируем ВСЮ текущую директорию в /cwbot
      - ./bins:/bins  # Монтируем локальную папку ./bin в /bins контейнера
    networks:
      - app_network
    restart: "no"


networks:
  app_network:
    driver: bridge
