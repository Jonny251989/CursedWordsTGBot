version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION}
    mem_limit: 4g
    mem_reservation: 2g
    ports:
      - "50051:50051"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "exit 0"] 
      start_period: 2m
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - MESSAGES_FILE_PATH=/cwbot/bins/Tests/FunctionalTests/Reactor_Tests/messages.txt
    entrypoint: []
    command: >
        sh -c "
          echo 'Запуск функциональных тестов...' &&
          find /cwbot/bins/Tests/FunctionalTests/Reactor_Tests -name '*_tests' -type f -executable -exec {} \;
        "
    depends_on:
     - grpc_server
    networks:
      - app_network
    restart: "no"

networks:
  app_network:
    driver: bridge