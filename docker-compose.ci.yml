version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION:-1.0}
    container_name: grpc_server
    volumes:
      - ./server_grpc:/app/server_grpc:ro,uid=0,gid=0  # Критичное исправление
    command: >
      sh -c "
      echo '=== Проверка файлов ===' &&
      ls -la /app/server_grpc &&
      python3 /app/server_grpc/server.py
      "
    working_dir: /app/server_grpc
    ports:
      - "50051:50051"
    networks:
      - app_network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    container_name: cursedwords_bot
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      grpc_server:
        condition: service_started
    networks:
      - app_network
    restart: on-failure

volumes:
  grpc_hf_cache:
    driver: local

networks:
  app_network:
    driver: bridge