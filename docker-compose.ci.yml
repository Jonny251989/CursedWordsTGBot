version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION:-1.0}
    container_name: grpc_server
    ports:
      - "50051:50051"
    networks:
      - app_network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1  # Для реального времени логов

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    container_name: cursedwords_bot
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051  # Подключаемся к серверу по DNS-имени
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      grpc_server:
        condition: service_started  # Ждем запуска сервера
    networks:
      - app_network
    restart: on-failure  # Автоперезапуск при ошибках

volumes:
  grpc_hf_cache:  # Для кэша моделей (если используется)
    driver: local

networks:
  app_network:
    driver: bridge