version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION:-1.0}
    container_name: grpc_server
    volumes:
      - ./server_grpc:/server_files:ro  # Монтируем в другую директорию
    command: >
      sh -c "
      echo '=== DEBUG ===' &&
      echo 'Содержимое /server_files:' && ls -la /server_files &&
      echo 'Запуск сервера...' &&
      cd /server_files && python3 server.py
      "
    ports:
      - "50051:50051"
    networks:
      - app_network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    container_name: cursedwords_bot
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      grpc_server:
        condition: service_started
    networks:
      - app_network
    restart: on-failure

volumes:
  grpc_hf_cache:
    driver: local

networks:
  app_network:
    driver: bridge