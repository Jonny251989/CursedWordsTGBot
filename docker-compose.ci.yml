version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION:-1.0}
    command: >
      sh -c "ls -la /server_files &&
      python3 /server_files/server.py"
    volumes:
      - ./server_grpc:/server_files
      - grpc_hf_cache:/root/.cache/huggingface/hub
    working_dir: /server_files
    mem_limit: 4g
    mem_reservation: 2g
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "python3", "-c", "YOUR_GRPC_HEALTHCHECK_SCRIPT"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      grpc_server:
        condition: service_healthy
    networks:
      - app_network

volumes:
  grpc_hf_cache:

networks:
  app_network:
    driver: bridge