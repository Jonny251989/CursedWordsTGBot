version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc-server:${COMMON_IMAGES_VERSION:-1.0}
    container_name: grpc_server
    ports:
      - "50051:50051"
    networks:
      - app_network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    container_name: cursedwords_bot
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - command_line_arguments=${TELEGRAM_TOKEN}  # Берётся из окружения runner-контейнера
    depends_on:
      grpc_server:
        condition: service_healthy
    networks:
      - app_network
    restart: on-failure

networks:
  app_network:
    driver: bridge

volumes:
  grpc_hf_cache:
    driver: local