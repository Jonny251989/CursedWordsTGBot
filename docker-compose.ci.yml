version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION:-1.0}
    container_name: grpc_server
    command: >
      sh -c "ls -la /app/server_grpc &&
      python3 server.py"  # Запуск относительно WORKDIR
    volumes:
      - ./server_grpc:/app/server_grpc  # Синхронизация с локальной папкой
      - grpc_hf_cache:/root/.cache/huggingface/hub
    working_dir: /app/server_grpc  # Основная рабочая директория
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "50051:50051"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION:-1.0}
    container_name: cursedwords_bot
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      - grpc_server  # Зависимость без healthcheck
    networks:
      - app_network
    restart: on-failure

volumes:
  grpc_hf_cache:
    driver: local

networks:
  app_network:
    driver: bridge