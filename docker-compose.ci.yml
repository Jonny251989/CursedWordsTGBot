version: '3.8'

services:
  grpc_server:
    image: ${DOCKER_USERNAME}/grpc_server:${COMMON_IMAGES_VERSION}
    mem_limit: 4g
    mem_reservation: 2g
    ports:
      - "50051:50051"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      start_period: 3m
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  cursedwords_bot:
    image: ${DOCKER_USERNAME}/cwbot:${TARGET_IMAGES_VERSION}
    environment:
      - GRPC_SERVER_ADDRESS=grpc_server:50051  # Явное указание порта
      - MESSAGES_FILE_PATH=/cwbot/bins/Tests/FunctionalTests/Reactor_Tests/messages.txt
    depends_on:
      grpc_server:
        condition: service_healthy
    entrypoint: []
    command: >
      sh -c "
      echo 'Waiting for grpc_server...';
      timeout 120 sh -c 'while ! nc -z grpc_server 50051; do 
        echo "Waiting..."; 
        sleep 2; 
      done' || exit 1;
      echo 'Server ready! Starting tests...';
      /cwbot/bins/Tests/FunctionalTests/Reactor_Tests/reactor_tests --gtest_color=yes
      "
    networks:
      - app_network
    restart: on-failure