name: CursedWords Bot CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMMON_IMAGES_VERSION: 1.0
  TARGET_IMAGES_VERSION: 1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-qemu-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run base container
        run: |
          docker run -d --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/workspace \
            -w /workspace \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0 \
            tail -f /dev/null

      - name: Verify Docker tools
        run: |
          docker exec cwbot_runner sh -c "
            ls -l /usr/bin/docker /usr/local/bin/docker-compose && \
            /usr/bin/docker --version && \
            /usr/local/bin/docker-compose --version
          "

      - name: Execute Docker Compose
        run: |
          docker exec cwbot_runner sh -c "
            export PATH='/usr/local/bin:/usr/bin:/bin:$PATH' && \
            /usr/bin/docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD && \
            /usr/local/bin/docker-compose -f docker-compose.ci.yml up -d
          "

      - name: Check services
        run: |
          docker exec cwbot_runner /usr/local/bin/docker-compose -f docker-compose.ci.yml ps