name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: "1.0"
  TARGET_IMAGES_VERSION: "1.0"
  BIN_PATH: "/repo/bins"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        COMMON_IMAGES_VERSION: "1.0"
        TARGET_IMAGES_VERSION: "1.0"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ${{ github.workspace }}:/repo
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker (inside container)
        uses: docker/setup-buildx-action@v2

      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "COMMON_IMAGES_VERSION=1.0" >> .env
          echo "TARGET_IMAGES_VERSION=1.0" >> .env

      - name: Build project
        run: |
          cd /repo && chmod +x build-local.sh && ./build-local.sh

      - name: Run unit tests
        run: |
          ls ${{ env.BIN_PATH }}/Tests/UnitTests/*/*_tests && \
          find ${{ env.BIN_PATH }}/Tests/UnitTests -name '*_tests' \
            -exec {} --gtest_output=xml:{}.xml \;

      - name: Start infrastructure
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d grpc_server

      - name: Run functional tests
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} run --rm test_runner

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ github.workspace }}/bins/Tests/**/*.xml
