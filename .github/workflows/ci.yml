name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install docker-compose and netcat
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Pull images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/grpc_server:1.0
          docker pull ${{ secrets.DOCKER_USERNAME }}/cwbot:1.0

      - name: Create environment file
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
          echo "COMMON_IMAGES_VERSION=1.0" >> .env
          echo "TARGET_IMAGES_VERSION=1.0" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d grpc_server
          # Ждём явного подтверждения готовности сервера
          docker-compose -f docker-compose.ci.yml exec -T grpc_server sh -c 'while ! nc -z localhost 50051; do sleep 1; done; echo "Server is ready"'
          docker-compose -f docker-compose.ci.yml up --abort-on-container-exit cursedwords_bot