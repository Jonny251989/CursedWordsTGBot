name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  BIN_PATH: "/repo/bins"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.DOCKERHUB_USERNAME }}/cwbot_base:1.0
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ${{ github.workspace }}:/repo
      options: --network host

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: /repo

      - name: Setup environment
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "DOCKER_USERNAME=${{ vars.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV

      - name: Build project
        run: |
          cd /repo
          chmod +x build-local.sh
          ./build-local.sh

      - name: Run unit tests
        run: |
          ${{ env.BIN_PATH }}/Tests/UnitTests/Parser_Tests/parser_tests --gtest_output=xml:unit_parser.xml
          ${{ env.BIN_PATH }}/Tests/UnitTests/Queue_Tests/queue_tests --gtest_output=xml:unit_queue.xml
          ${{ env.BIN_PATH }}/Tests/UnitTests/SignalHandler_Tests/signalhandler_tests --gtest_output=xml:unit_signal.xml

      - name: Start infrastructure
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d grpc_server
          sleep 15

      - name: Run functional tests
        run: |
          GRPC_SERVER_ADDRESS=grpc_server:50051 \
          MESSAGES_FILE_PATH=/repo/bins/Tests/FunctionalTests/Reactor_Tests/messages.txt \
          ${{ env.BIN_PATH }}/Tests/FunctionalTests/Reactor_Tests/reactor_tests --gtest_output=xml:functional.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: /repo/*.xml