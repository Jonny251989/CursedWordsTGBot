name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: 1.0
  TARGET_IMAGES_VERSION: 1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare base container
        run: |
          docker run -d --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/workspace \
            -w /workspace \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0 \
            tail -f /dev/null

      - name: Pull and run services
        run: |
          docker exec cwbot_runner sh -c "
            # Аутентификация в Docker Hub
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
            
            # Подтягиваем свежие образы
            docker-compose -f /workspace/docker-compose.ci.yml pull
            
            # Запускаем сервисы с интерактивным выводом
            docker-compose -f /workspace/docker-compose.ci.yml up --no-build 2>&1 | tee /workspace/compose.log
          "
          
          # Выводим логи в интерфейс GitHub Actions
          docker exec cwbot_runner cat /workspace/compose.log

      - name: Verify services
        if: always()
        run: |
          docker exec cwbot_runner sh -c "
            echo '=== Service status ==='
            docker-compose -f /workspace/docker-compose.ci.yml ps -a
            echo '\n=== Last 100 logs ==='
            docker-compose -f /workspace/docker-compose.ci.yml logs --tail=100 --no-color
          "