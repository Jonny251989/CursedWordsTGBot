name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml  # Основной compose-файл
  COMMON_IMAGES_VERSION: 1.0          # Версия базового образа
  TARGET_IMAGES_VERSION: 1.0          # Версия целевых образов

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Загрузка кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Настройка Docker
      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      # 3. Аутентификация в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Подготовка переменных окружения
      - name: Create environment file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "COMMON_IMAGES_VERSION=1.0" >> .env
          echo "TARGET_IMAGES_VERSION=1.0" >> .env

      # 5. Запуск базового контейнера с монтированием
      - name: Prepare base container
        run: |
          docker run -d \
            --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \    # Доступ к Docker
            -v "${{ github.workspace }}":/repo \              # Монтирование репозитория
            -w /repo \                                        # Рабочая директория
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }} \
            tail -f /dev/null

      # 6. Запуск сервисов через docker-compose
      - name: Run services
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /repo/docker-compose.ci.yml pull && \
            docker-compose -f /repo/docker-compose.ci.yml up \
              --abort-on-container-exit \
              --exit-code-from test_runner
          "