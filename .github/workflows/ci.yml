name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]  # Запускать только для указанных событий

env:  # Выносим общие переменные на уровень всего workflow
  BASE_IMAGE: docker.io/jonnyrembo/cwbot_base
  BASE_IMAGE_VERSION: "1.0"
  DOCKER_USERNAME: "jonnyrembo"
  COMMON_IMAGES_VERSION: "1.0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.BASE_IMAGE }}:${{ env.BASE_IMAGE_VERSION }}  # Используем переменные для версии
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # Только токен без флага
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        COMMON_IMAGES_VERSION: ${{ env.COMMON_IMAGES_VERSION }}
        SOURCE_DIR: ${{ github.workspace }}
      volumes:  
        - /var/run/docker.sock:/var/run/docker.sock
        - ${{ github.workspace }}:/github/workspace 
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          ./build-local.sh

      - name: Run all unit tests
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Start infrastructure and run functional tests
        run: |
          ./functional_tests_enviroment.sh up
          ./docker-compose-run-tests.sh
          ./functional_tests_enviroment.sh down