name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: "1.0"
  TARGET_IMAGES_VERSION: "1.0"
  BIN_PATH: "/repo/bins"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create environment file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "COMMON_IMAGES_VERSION=1.0" >> .env
          echo "TARGET_IMAGES_VERSION=1.0" >> .env

      - name: Prepare base container
        run: |
          docker run -d \
            --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}":/repo \
            -w /repo \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }} \
            tail -f /dev/null

      - name: Build project
        run: |
          docker exec cwbot_runner /bin/sh -c \
            "cd /repo && chmod +x build-local.sh && ./build-local.sh"

      - name: Verify binaries existence
        run: |
          docker exec cwbot_runner /bin/sh -c \
            "ls -la ${{ env.BIN_PATH }}/Tests/UnitTests/*/*_tests"

      - name: Run unit tests
        run: |
          docker exec cwbot_runner /bin/sh -c \
            "${{ env.BIN_PATH }}/Tests/UnitTests/Parser_Tests/parser_tests --gtest_output=xml:${{ env.BIN_PATH }}/parser_test_results.xml && \
             ${{ env.BIN_PATH }}/Tests/UnitTests/Queue_Tests/queue_tests --gtest_output=xml:${{ env.BIN_PATH }}/queue_test_results.xml && \
             ${{ env.BIN_PATH }}/Tests/UnitTests/SignalHandler_Tests/signalhandler_tests --gtest_output=xml:${{ env.BIN_PATH }}/signalhandler_test_results.xml"

      - name: Prepare for functional tests
        run: |
          docker compose -f docker-compose.ci.yml up -d grpc_server

      - name: Run functional tests
        run: |
          docker exec cwbot_runner /bin/sh -c \
            "GRPC_SERVER_ADDRESS=grpc_server:50051 \
             MESSAGES_FILE_PATH=${{ env.BIN_PATH }}/Tests/FunctionalTests/Reactor_Tests/messages.txt \
             ${{ env.BIN_PATH }}/Tests/FunctionalTests/Reactor_Tests/reactor_tests --gtest_output=xml:${{ env.BIN_PATH }}/reactor_test_results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4  # Исправленная версия
        with:
          name: test-reports
          path: |
            ${{ github.workspace }}/bins/*_results.xml
            ${{ github.workspace }}/bins/Tests/**/*_results.xml