name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: "1.0"
  TARGET_IMAGES_VERSION: "1.0"
  BIN_PATH: "/repo/bins"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: docker:dind  # Базовый образ с Docker
      volumes:
        - ${{ github.workspace }}:/repo
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: /repo

      - name: Login to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login \
            -u ${{ secrets.DOCKER_USERNAME }} \
            --password-stdin

      - name: Pull base image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }}

      - name: Build and test
        run: |
          docker run --rm \
            -v /repo:/repo \
            -w /repo \
            -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }} \
            sh -c "
              chmod +x build-local.sh && \
              ./build-local.sh && \
              find /repo/bins/Tests/UnitTests -name '*_tests' \
                -exec {} --gtest_output=xml:{}.xml \;
            "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ github.workspace }}/bins/**/*.xml