name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull base image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0

      - name: Run base container with Docker-in-Docker
        run: |
          docker run --rm -d \
            --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/workspace \
            -w /workspace \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            -e COMMON_IMAGES_VERSION=1.0 \
            -e TARGET_IMAGES_VERSION=1.0 \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0 \
            sleep infinity

      - name: Execute Docker Compose inside container
        run: |
          docker exec cwbot_runner sh -c "
            docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD && \
            docker-compose -f docker-compose.ci.yml up -d
          "

      - name: Verify services
        run: |
          docker exec cwbot_runner docker ps
          docker exec cwbot_runner docker-compose -f docker-compose.ci.yml logs