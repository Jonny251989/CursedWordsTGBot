name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: 1.0
  TARGET_IMAGES_VERSION: 1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run base container
        run: |
          docker run -d --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/workspace \
            -w /workspace \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}" \
            -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0 \
            tail -f /dev/null

      - name: Validate compose file
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /workspace/docker-compose.ci.yml config
          "

      - name: Launch services with live logs
        run: |
          docker exec cwbot_runner sh -c "
            # Запускаем сервисы в foreground-режиме (без -d)
            docker-compose -f /workspace/docker-compose.ci.yml up --build 2>&1 | tee /workspace/compose.log
          "

      - name: Verify services
        timeout-minutes: 5
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /workspace/docker-compose.ci.yml ps
            docker-compose -f /workspace/docker-compose.ci.yml logs --tail=50 grpc_server
          "