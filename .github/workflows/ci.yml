name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: "1.0"  # Кавычки для строки
  TARGET_IMAGES_VERSION: "1.0"   # Кавычки для строки

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create environment file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          # Убраны дублирующиеся переменные версий, если не используются в контейнере

      - name: Prepare base container
        run: |
          docker run -d \
            --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}":/repo \
            -w /repo \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }} \  # Теперь здесь 1.0
            tail -f /dev/null

      - name: Run services
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /repo/docker-compose.ci.yml pull && \
            docker-compose -f /repo/docker-compose.ci.yml up \
              --abort-on-container-exit \
              --exit-code-from test_runner
          "