name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: 1.0
  TARGET_IMAGES_VERSION: 1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create environment file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
          echo "COMMON_IMAGES_VERSION=1.0" >> .env
          echo "TARGET_IMAGES_VERSION=1.0" >> .env

      - name: Prepare base container
        run: |
          docker run -d --name cwbot_runner \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/workspace \
            -w /workspace \
            -e DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e COMMON_IMAGES_VERSION="1.0" \
            -e TARGET_IMAGES_VERSION="1.0" \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:1.0 \
            tail -f /dev/null

      - name: Debug environment
        run: |
          docker exec cwbot_runner sh -c "echo 'TELEGRAM_TOKEN='\$TELEGRAM_TOKEN"

      - name: Build and push services
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /workspace/docker-compose.ci.yml build
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
            docker-compose -f /workspace/docker-compose.ci.yml push
          "

      - name: Run services
        run: |
          docker exec cwbot_runner sh -c "
            docker-compose -f /workspace/docker-compose.ci.yml up 
              --exit-code-from cursedwords_bot 
              --abort-on-container-exit
          "

      - name: Verify deployment
        if: always()
        run: |
          docker exec cwbot_runner sh -c "
            docker ps -a
            docker-compose -f /workspace/docker-compose.ci.yml logs --tail=100
          "