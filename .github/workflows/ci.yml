name: CursedWords Bot CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  COMPOSE_FILE: docker-compose.ci.yml
  COMMON_IMAGES_VERSION: "1.0"
  TARGET_IMAGES_VERSION: "1.0"
  BIN_PATH: "$GITHUB_WORKSPACE/bins"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: docker:dind
      volumes:
        - $GITHUB_WORKSPACE:/workspace
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: workspace  # Относительный путь внутри GITHUB_WORKSPACE

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and test
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE:/repo \
            -w /repo/workspace \
            -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            ${{ secrets.DOCKER_USERNAME }}/cwbot_base:${{ env.COMMON_IMAGES_VERSION }} \
            sh -c "
              chmod +x build-local.sh && \
              ./build-local.sh && \
              find /repo/workspace/bins/Tests/UnitTests -name '*_tests' \
                -exec {} --gtest_output=xml:{}.xml \;
            "